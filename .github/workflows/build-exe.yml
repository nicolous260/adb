name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller qrcode windnd

      - name: Build exe
        run: python -m PyInstaller --onefile --noconsole --icon assets/icon-dark.ico --name ADBFileTransfer adb_transfer.py

      - uses: actions/upload-artifact@v4
        with:
          name: ADBFileTransfer
          path: dist/ADBFileTransfer.exe

      - name: Publish latest release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Newest ADBFileTransfer.exe, built from the main branch.
          files: dist/ADBFileTransfer.exe
          make_latest: true

      - name: Attach exe to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ADBFileTransfer.exe
